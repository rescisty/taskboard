<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Creators — TaskBoard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="wrap">
            <a href="index.html" class="logo">Task<span>Board</span></a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="browse.html" class="active">Browse</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="request.html">Post a Task</a></li>
                    <li><a href="status.html">Status</a></li>
                </ul>
            </nav>
            <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main>
        <div class="page-header">
            <div class="wrap">
                <h1>Browse Creators</h1>
                <p>Search by name or filter by category to find who you need.</p>
            </div>
        </div>

        <div class="section">
            <div class="wrap">
                <div class="browse-controls">
                    <input type="text" class="search-input" placeholder="Search creators by name...">
                </div>

                <div class="browse-controls">
                    <button class="chip-filter is-active" data-category="all">All</button>
                    <button class="chip-filter" data-category="art">Art &amp; Illustration</button>
                    <button class="chip-filter" data-category="coding">Coding &amp; Development</button>
                    <button class="chip-filter" data-category="editing">Video &amp; Photo Editing</button>
                    <button class="chip-filter" data-category="3d">3D &amp; Rigging</button>
                    <button class="chip-filter" data-category="writing">Writing</button>
                    <button class="chip-filter" data-category="audio">Audio &amp; Music</button>
                    <button class="chip-filter" data-category="design">Design</button>
                </div>

                <div class="creator-grid" data-creator-grid="all"></div>

                <p class="empty-state">No creators match your search. Try a different name or category.</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <span>&copy; 2026 TaskBoard. Term project — not a real business.</span>
            <span>Made with HTML, CSS &amp; JS</span>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
