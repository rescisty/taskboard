<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — TaskBoard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="wrap">
            <a href="index.html" class="logo">Task<span>Board</span></a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="browse.html">Browse</a></li>
                    <li><a href="tasks.html">Tasks</a></li>
                    <li><a href="messages.html" class="active">Messages</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="request.html">Post a Task</a></li>
                    <li><a href="status.html">Status</a></li>
                    <li class="nav-divider nav-auth-link"><a href="login.html">Log In</a></li>
                    <li class="nav-auth-link"><a href="signup.html" class="nav-cta">Sign Up</a></li>
                    <li class="nav-account"><a href="account.html" class="account-avatar" aria-label="Your account"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path></svg></a></li>
                </ul>
            </nav>
            <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main>
        <div class="page-header">
            <div class="wrap">
                <h1>Messages</h1>
                <p>Private conversations with creators and clients.</p>
            </div>
        </div>
        <section class="section">
            <div class="wrap">
                <div class="chat">
                    <aside class="chat-side" data-chat-list aria-label="Conversations"></aside>
                    <div class="chat-main">
                        <div class="chat-head">
                            <button class="btn btn-outline btn-sm chat-back" type="button" data-chat-back>&larr; Back</button>
                            <span data-chat-title>Pick a conversation</span>
                        </div>
                        <div class="chat-thread" data-chat-thread aria-live="polite"></div>
                        <form class="chat-form" data-chat-form>
                            <input type="text" data-chat-input placeholder="Write a message..." aria-label="Message" autocomplete="off">
                            <button class="btn btn-primary" type="submit">Send</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <span>&copy; 2026 TaskBoard. Term project — not a real business.</span>
            <span>Made with HTML, CSS &amp; JS</span>
        </div>
    </footer>

    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
